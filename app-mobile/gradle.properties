# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# AGP 9 ships a built-in Kotlin plugin that forbids the legacy kotlin.sourceSets DSL.
# KSP (Room's annotation processor) uses it to register its generated sources, so we
# opt back into allowing it. See https://developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false
# Debug backend host. Loopback, because a physical device reaches the developer machine over
# `adb reverse tcp:4010 tcp:4010` (USB) rather than the LAN. That tunnel makes the phone's own
# localhost the machine's, so this address is stable — unlike a LAN IP, which moves with every
# DHCP lease and silently turns into an "unreachable backend" at test time. Committed for the
# same reason: it is not machine-specific.
#
# Named separately from app-pos's `posApiHost`: the two are separate Gradle builds, and a
# two-device test (POS on the phone, mobile on the emulator) needs different answers.
#
# To fall back to Wi-Fi, override per-build without editing this file:
#   ./gradlew -PmobileApiHost=$(ipconfig getifaddr en0) :app:installDebug
mobileApiHost=192.168.155.137
# Never auto-download a JDK toolchain. We build with the Android Studio JBR (Java 21,
# jlink-capable) supplied via JAVA_HOME. Without this, Gradle may pick up a JRE that has no
# jlink (e.g. the VSCode Red Hat Java extension's bundled runtime) and JdkImageTransform fails.
# Kept in sync with app-pos.
org.gradle.java.installations.auto-download=false

# Do not go looking for JDKs either. auto-download=false alone was NOT enough: Gradle still
# discovered the VSCode Red Hat extension's bundled runtime, which is a JRE — it ships `java`
# but no `jlink`, and Android's JdkImageTransform needs jlink. The build then failed with
# "jlink executable ... does not exist" pointing into ~/.vscode, which reads like the
# extension is at fault when the real problem is that it was ever considered.
#
# With detection off, the JDK is whatever JAVA_HOME names (the Android Studio JBR) — one
# explicit source instead of a scan whose result depends on what is installed that day.
org.gradle.java.installations.auto-detect=false